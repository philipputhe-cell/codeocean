services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  codeocean:
    build: .
    image: codeocean:test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    ports:
      - "7000:7000"

volumes:
  db-data:
